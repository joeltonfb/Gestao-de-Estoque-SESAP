<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Gestão de Estoque — SESAP RN</title>
<!--
  Endereço antigo do painel. Agora só orienta o visitante a usar o hub da SESAP.
  O painel de estoques continua em painel.html (é nele que o robô injeta os dados).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px;
    display: flex; align-items: center; justify-content: center;
    background: #F3F7FB; color: #102338;
    font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 520px; padding: 32px 28px; text-align: center;
    background: #FFFFFF; border: 1px solid #DBE5EE; border-radius: 16px;
    box-shadow: 0 8px 30px rgba(25, 63, 95, 0.06);
  }
  .rotulo {
    margin: 0 0 12px; font-size: 12px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; color: #168E86;
  }
  h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; line-height: 1.3; }
  p  { margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #62758A; }
  a.botao {
    display: inline-block; padding: 12px 22px; border-radius: 10px;
    background: #103B66; color: #FFFFFF; font-weight: 600; font-size: 15px;
    text-decoration: none; transition: background .15s;
  }
  a.botao:hover  { background: #0C2F52; }
  a.botao:focus-visible { outline: 3px solid #42C0B5; outline-offset: 2px; }
  .url { margin: 16px 0 0; font-size: 13px; word-break: break-all; }
  .url a { color: #168E86; }
</style>
</head>
<body>
  <main class="card">
    <div class="rotulo">SESAP RN</div>
    <h1>Painel de Gestão de Estoque</h1>
    <p>Para acessar os dados do Painel de Gestão de Estoque da rede SESAP RN, entre em:</p>
    <a class="botao" href="https://sesapbpm.github.io/painel-dashboards/">Acessar o painel</a>
    <p class="url"><a href="https://sesapbpm.github.io/painel-dashboards/">https://sesapbpm.github.io/painel-dashboards/</a></p>
  </main>
</body>
</html>
